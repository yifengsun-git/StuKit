name: Windows CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.10.3"
  QT_ARCH: "win64_msvc2022_64"
  QT_INSTALL_ARCH: "msvc2022_64"
  QT_ROOT: ${{ github.workspace }}\Qt
  BUILD_DIR: ${{ github.workspace }}\build\ci-windows
  INSTALL_DIR: ${{ github.workspace }}\dist\StuKit
  ARCHIVE_PATH: ${{ github.workspace }}\dist\StuKit-windows-x64.zip

jobs:
  build-and-test:
    name: Build, test, and package Windows
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-qtcharts-v1

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop `
            $env:QT_VERSION $env:QT_ARCH `
            --outputdir $env:QT_ROOT `
            --modules qtcharts

      - name: Configure Qt environment
        shell: pwsh
        run: |
          $qtDir = Join-Path $env:QT_ROOT "$env:QT_VERSION\$env:QT_INSTALL_ARCH"
          if (-not (Test-Path -LiteralPath "$qtDir\bin\Qt6Core.dll")) {
            throw "Qt installation was not found at $qtDir"
          }
          "QT_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qtDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $cmake = Get-Content -Raw -LiteralPath CMakeLists.txt
          if ($cmake -notmatch 'project\(StuKit VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read the StuKit version from CMakeLists.txt"
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $expectedTag"
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_DIR" `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel 2

      - name: Run tests
        shell: pwsh
        run: >-
          ctest --test-dir $env:BUILD_DIR -C Release
          --output-on-failure --no-tests=error --timeout 180

      - name: Create deployable directory
        shell: pwsh
        run: |
          cmake --install $env:BUILD_DIR `
            --config Release `
            --prefix $env:INSTALL_DIR

      - name: Smoke-test deployed application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          STUKIT_APP_DATA_DIR: ${{ runner.temp }}\stukit-smoke-data
        run: |
          $executable = Join-Path $env:INSTALL_DIR "bin\StuKit.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Deployed executable was not found at $executable"
          }

          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Deployed application exited with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Create ZIP package
        shell: pwsh
        run: |
          $archiveDirectory = Split-Path -Parent $env:ARCHIVE_PATH
          New-Item -ItemType Directory -Force -Path $archiveDirectory | Out-Null
          Compress-Archive `
            -LiteralPath $env:INSTALL_DIR `
            -DestinationPath $env:ARCHIVE_PATH `
            -CompressionLevel Optimal `
            -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: StuKit-windows-x64
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: StuKit-windows-x64
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/StuKit-windows-x64.zip
          --verify-tag
          --generate-notes
          --title "StuKit ${GITHUB_REF_NAME}"
